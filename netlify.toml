[build]
  publish = "."

# The AI coach's key lives in an environment variable on the server, never in
# the bundle. Set ANTHROPIC_API_KEY in Netlify to switch the hosted coach on;
# leave it unset and the app falls back to each user's own key.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The service worker must never be served stale, or updates never reach users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

# The source files are NOT fingerprinted — js/app.js keeps that name across
# every deploy. Marking them `immutable` told every phone that already loaded
# the app to keep its copy for a year and never ask again, which defeated the
# service worker's network-first rule: `fetch()` was answered by the browser's
# own HTTP cache before it ever reached the network. That is why updates
# stopped arriving on installed phones. They must revalidate; ETags keep the
# cost of doing so at one 304.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Exercise photos are fingerprint-free but never overwritten in place — a
# changed photo gets a new filename. The app icon and login logo are not:
# this session's icon redraw shipped under the *same* filenames as before,
# and `immutable` told every browser and CDN edge to keep serving last
# month's bytes for a year without ever asking again. Same bug as /js/*,
# same fix — these few files are worth a revalidation round trip.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Must come before the SPA fallback, or the catch-all swallows the API.
[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach"
  status = 200

[[redirects]]
  from = "/api/backup"
  to = "/.netlify/functions/backup"
  status = 200

# Single-page app: every path falls back to the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
